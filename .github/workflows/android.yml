name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Uji inti Rust lebih dulu supaya kegagalan logika ketahuan tanpa perlu SDK.
  rust-tests:
    name: Uji Rust (kg-core + kg-ffi)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang toolchain Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build APK debug
    runs-on: ubuntu-latest
    needs: rust-tests

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Target Android untuk kompilasi silang inti Rust.
      - name: Pasang target Rust Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo (build Android)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      # Runner ubuntu-latest sudah menyertakan Android SDK beserta lisensi yang
      # sudah diterima. Aksi android-actions/setup-android tidak dipakai karena
      # kini gagal: ia mencoba memasang paket "tools" yang sudah dihapus dari
      # repositori SDK ("Failed to find package 'tools'").
      - name: Info Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          echo "ndk:"; ls -1 "$SDK/ndk" 2>/dev/null || true
          echo "build-tools:"; ls -1 "$SDK/build-tools" 2>/dev/null || true

      - name: Pastikan platform android-34 dan NDK 27 (best effort)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          MANAGER=$(command -v sdkmanager || true)
          if [ -z "$MANAGER" ]; then
            MANAGER=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi
          if [ -n "$MANAGER" ]; then
            yes | "$MANAGER" --licenses > /dev/null 2>&1 || true
            "$MANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" || true
          else
            echo "sdkmanager tidak ditemukan — AGP akan memakai SDK yang sudah ada"
          fi

      - name: Build (Rust + Kotlin + APK)
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          # Kompilasi Kotlin dalam proses Gradle: daemon Kotlin menulis ke
          # ~/.local/share/kotlin dan tidak diperlukan di sini.
          if ./gradlew --version > /dev/null 2>&1; then
            echo "::notice::wrapper ./gradlew berfungsi"
            ./gradlew assembleDebug -Pkotlin.compiler.execution.strategy=in-process --no-daemon
          else
            echo "::warning::wrapper tidak jalan, memakai Gradle dari action"
            gradle assembleDebug -Pkotlin.compiler.execution.strategy=in-process --no-daemon
          fi

      - name: Uji unit Kotlin terhadap pustaka Rust
        working-directory: android
        run: ./gradlew testDebugUnitTest -Pkotlin.compiler.execution.strategy=in-process --no-daemon

      - name: Tampilkan APK yang dihasilkan
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: korean-grammar-rust-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Buat Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/debug/*.apk \
            --title "Korean Grammar (Rust) ${GITHUB_REF_NAME}" \
            --generate-notes
