org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Folder kerja sementara untuk Gradle & Kotlin (daemon mewarisi nilai ini).
# Default-nya bisa tidak bisa ditulis di mesin dengan profil terbatas.
# Windows: %USERPROFILE%\.gradle\tmp ; Linux/macOS: /tmp/gradle-tmp
# Timpa dengan -Dorg.gradle.jvmargs=-Djava.io.tmpdir=...
kotlin.daemon.jvmargs=-Xmx2g
