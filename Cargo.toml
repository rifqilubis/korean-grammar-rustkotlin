[workspace]
resolver = "2"
members = ["kg-core", "kg-ffi", "kg-ffi/uniffi-bindgen"]
exclude = ["android"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/rifqilubis/korean-grammar"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
