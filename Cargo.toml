[workspace]
resolver = "2"
members = ["kg-core", "kg-ffi", "kg-ffi/uniffi-bindgen", "kg-desktop"]
exclude = ["android"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/rifqilubis/korean-grammar"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# JANGAN strip="symbols": uniffi-bindgen membaca metadata UniFFI dari simbol
# UNIFFI_META_* di pustaka host. Di Linux/macOS strip menghapus simbol itu
# (muncul "No UniFFI metadata found"), sedangkan di Windows tetap ada — jadi
# masalah ini tidak terlihat saat build lokal.
strip = "none"
